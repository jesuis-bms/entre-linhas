
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Entre Linhas: uma experiência narrativa sobre bullying e cyberbullying."
    >

    <meta name="theme-color" content="#10141b">

    <title>Entre Linhas</title>

    <link rel="stylesheet" href="style.css">

    <script src="data.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <main id="app">
        <section
            id="lock-screen"
            class="screen active"
            aria-label="Tela de bloqueio"
        >
            <div class="status-bar">
                <span id="status-time">09:41</span>

                <div class="status-icons" aria-hidden="true">
                    <span>●</span>
                    <span>◖</span>
                    <span>▰</span>
                </div>
            </div>

            <div class="lock-content">
                <p id="lock-date" class="lock-date">
                    Quarta-feira, 14 de outubro
                </p>

                <h1 id="lock-time" class="lock-time">09:41</h1>

                <div
                    id="notifications"
                    class="notifications"
                    aria-label="Notificações"
                >
                    <!-- As notificações serão inseridas pelo JavaScript. -->
                </div>
            </div>

            <div class="lock-footer">
                <span class="lock-shortcut" aria-hidden="true">◉</span>

                <button
                    id="unlock-button"
                    type="button"
                    aria-label="Desbloquear celular"
                >
                    Deslize para abrir
                </button>

                <span class="lock-shortcut" aria-hidden="true">⌕</span>
            </div>
        </section>


        <!-- Aplicativo de mensagens -->
        <section
            id="messages-screen"
            class="screen"
            aria-label="Aplicativo de mensagens"
            hidden
        >
            <header class="app-header">
                <button
                    class="back-button"
                    type="button"
                    data-action="lock"
                    aria-label="Voltar para a tela de bloqueio"
                >
                    ←
                </button>

                <div class="app-heading">
                    <h2>Mensagens</h2>
                    <p id="messages-subtitle">Suas conversas</p>
                </div>
            </header>

            <div
                id="conversation-list"
                class="conversation-list"
            >
                <!-- A lista de conversas será criada pelo JavaScript. -->
            </div>

            <article
                id="conversation-view"
                class="conversation-view"
                hidden
            >
                <header class="conversation-header">
                    <button
                        id="back-to-conversations"
                        type="button"
                        aria-label="Voltar às conversas"
                    >
                        ←
                    </button>

                    <div>
                        <h3 id="conversation-title">Grupo da turma</h3>
                        <p id="conversation-description">
                            Conversa em grupo
                        </p>
                    </div>
                </header>

                <div
                    id="message-list"
                    class="message-list"
                    aria-live="polite"
                    aria-relevant="additions"
                >
                    <!-- As mensagens aparecerão em sequência. -->
                </div>

                <div class="message-footer">
                    <span>Mensagens fictícias para fins narrativos.</span>
                </div>
            </article>
        </section>


        <!-- Rede social fictícia -->
        <section
            id="social-screen"
            class="screen"
            aria-label="Rede social"
            hidden
        >
            <header class="app-header">
                <button
                    class="back-button"
                    type="button"
                    data-action="messages"
                    aria-label="Voltar às mensagens"
                >
                    ←
                </button>

                <div class="app-heading">
                    <h2>Conexões</h2>
                    <p>Uma rede social fictícia</p>
                </div>
            </header>

            <div id="social-profile" class="social-profile">
                <!-- O perfil da personagem será inserido pelo JavaScript. -->
            </div>

            <div
                id="social-feed"
                class="social-feed"
                aria-label="Publicações"
            >
                <!-- Fotos, vídeos fictícios e comentários aparecerão aqui. -->
            </div>
        </section>


        <!-- Encerramento da narrativa e campanha -->
        <section
            id="ending-screen"
            class="screen"
            aria-label="Conclusão da campanha"
            hidden
        >
            <div class="ending-content">
                <p class="eyebrow">FIM DA EXPERIÊNCIA</p>

                <h2>ENTRE LINHAS</h2>

                <p id="ending-message">
                    Nem tudo o que machuca deixa marcas visíveis.
                </p>

                <div id="ending-details">
                    <!-- O texto final da campanha será inserido pelo JavaScript. -->
                </div>

                <button id="restart-button" type="button">
                    Reviver a experiência
                </button>
            </div>
        </section>

    </main>
</body>
</html>
